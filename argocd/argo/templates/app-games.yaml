apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd-image-updater.argoproj.io/image-list: factoriotools/factorio:^1
  name: app-games
  namespace: argocd
spec:
  destination:
    name: in-cluster
    namespace: games
  project: default
  source:
    path: argocd/app-games/games
    repoURL: https://github.com/kumorikarasu/home.git
    targetRevision: HEAD
  syncPolicy:
    syncOptions:
    - ApplyOutOfSyncOnly=true
