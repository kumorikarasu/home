{{- with .Values.syncSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: wrbgc-sync-env
type: Opaque
stringData:
  DISCORD_BOT_TOKEN: {{ .DISCORD_BOT_TOKEN | quote }}
  DISCORD_GUILD_ID: {{ $.Values.sync.discordGuildId | quote }}
  DISCORD_ANNOUNCEMENTS_CHANNEL_ID: {{ $.Values.sync.discordAnnouncementsChannelId | quote }}
  GOOGLE_CALENDAR_ID: {{ $.Values.sync.googleCalendarId | quote }}
  GOOGLE_SERVICE_ACCOUNT_JSON: {{ .GOOGLE_SERVICE_ACCOUNT_JSON | quote }}
  R2_ACCOUNT_ID: {{ .R2_ACCOUNT_ID | quote }}
  R2_ACCESS_KEY_ID: {{ .R2_ACCESS_KEY_ID | quote }}
  R2_SECRET_ACCESS_KEY: {{ .R2_SECRET_ACCESS_KEY | quote }}
  R2_BUCKET: {{ .R2_BUCKET | quote }}
  R2_ANNOUNCEMENTS_KEY: {{ .R2_ANNOUNCEMENTS_KEY | quote }}
  PUBLIC_ANNOUNCEMENTS_BASE_URL: {{ .PUBLIC_ANNOUNCEMENTS_BASE_URL | quote }}
  PURGE_CLOUDFLARE_CACHE: {{ default "false" .PURGE_CLOUDFLARE_CACHE | quote }}
  CLOUDFLARE_ZONE_ID: {{ default "" .CLOUDFLARE_ZONE_ID | quote }}
  CLOUDFLARE_API_TOKEN: {{ default "" .CLOUDFLARE_API_TOKEN | quote }}
  ANNOUNCEMENT_LIMIT: {{ .ANNOUNCEMENT_LIMIT | quote }}
  DEFAULT_EVENT_DURATION_MINUTES: {{ .DEFAULT_EVENT_DURATION_MINUTES | quote }}
  RUST_LOG: {{ .RUST_LOG | quote }}
{{- end }}
