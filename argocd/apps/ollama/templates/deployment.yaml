apiVersion: v1
kind: PersistentVolume
metadata:
  name: "{{ .Release.Name }}-models-pv"
spec:
  capacity:
    storage: {{ .Values.storage.size }}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  claimRef:
    namespace: {{ .Release.Namespace }}
    name: "{{ .Release.Name }}-models-pvc"
  hostPath:
    path: {{ .Values.storage.path | quote }}
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values: [{{ .Values.node | quote }}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "{{ .Release.Name }}-models-pvc"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-storage
  volumeName: "{{ .Release.Name }}-models-pv"
  resources:
    requests:
      storage: {{ .Values.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-deployment"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: "{{ .Release.Name }}-ollama"
  template:
    metadata:
      labels:
        app: "{{ .Release.Name }}-ollama"
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.node | quote }}
      runtimeClassName: nvidia
      containers:
      - name: ollama
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        env:
        - name: NVIDIA_VISIBLE_DEVICES
          value: all
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: compute,utility
        ports:
        - name: http
          containerPort: 11434
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 10
        volumeMounts:
        - name: models
          mountPath: /root/.ollama
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: "{{ .Release.Name }}-models-pvc"
---
apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}-service"
spec:
  type: LoadBalancer
  selector:
    app: "{{ .Release.Name }}-ollama"
  ports:
  - name: http
    port: 11434
    targetPort: http
