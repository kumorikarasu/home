name: minecraft-prom2

image:
  name: itzg/minecraft-server
  tag: java17

service:
  type: LoadBalancer
  loadBalancerIP: 192.168.28.21
  externalTrafficPolicy: Local
  port: 25565

resources:
  requests:
    memory: 32Gi
    cpu: 3000m
  limits:
    memory: 32Gi

storage:
  existingClaim: appdata-pvc
  subPath: minecraft/prom2

minecraft:
  eula: "TRUE"
  type: FABRIC
  version: "1.20.1"
  memory: 32G
  uid: "1000"
  gid: "1000"
  umask: "000"
  ops: kumorikarasu
