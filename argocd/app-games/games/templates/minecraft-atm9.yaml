---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-minecraft-atm9
  namespace: argocd
spec:
  destination:
    name: in-cluster
    namespace: apps
  project: default
  source:
    path: argocd/app-games/minecraft-atm9
    repoURL: https://github.com/kumorikarasu/home.git
    targetRevision: HEAD
  syncPolicy:
    syncOptions:
    - ApplyOutOfSyncOnly=true
