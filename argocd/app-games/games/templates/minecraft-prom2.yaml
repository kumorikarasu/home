---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-minecraft-prom2
  namespace: argocd
spec:
  destination:
    name: in-cluster
    namespace: games
  project: default
  source:
    path: argocd/app-games/minecraft-prom2
    repoURL: https://github.com/kumorikarasu/home.git
    targetRevision: HEAD
  syncPolicy:
    syncOptions:
    - ApplyOutOfSyncOnly=true
