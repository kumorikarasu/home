name: riftbreaker

image:
  repository: registry.home.ryougi.ca/riftbreaker
  tag: latest
  pullPolicy: Always

service:
  loadBalancerIP: 192.168.28.23
  port: 6321

storage:
  existingClaim: appdata-pvc

resources:
  requests:
    cpu: 4
    memory: 8Gi
  limits:
    cpu: 8
    memory: 16Gi

server:
  name: Riftbreaker
  password: ""
  maxPlayers: "4"
  # Open Campaign is the game's sandbox-style mode.
  mission: campaigns/open/headquarters_jungle
  difficulty: hard
  # false uses the Steam server browser; true enables direct LAN connections on port 6321.
  disableSteam: false
