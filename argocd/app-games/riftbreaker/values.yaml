name: riftbreaker

image:
  repository: registry.home.ryougi.ca/riftbreaker
  tag: latest
  pullPolicy: Always

service:
  loadBalancerIP: 192.168.28.23
  port: 6321
  steamPort: 27015

storage:
  existingClaim: appdata-pvc
  serverPath: riftbreaker/server
  savesPath: riftbreaker/saves
  runtime:
    storageClass: hpe
    wineSize: 10Gi
    steamHomeSize: 10Gi

resources:
  requests:
    cpu: 4
    memory: 8Gi
  limits:
    cpu: 8
    memory: 16Gi

server:
  name: Riftbreaker
  maxPlayers: "4"
  # Open Campaign is the game's sandbox-style mode.
  mission: campaigns/open/headquarters_ice
  difficulty: hard
  # SteamCMD downloads tool 4114030; Steam networking uses the playable game ID.
  steamGameAppId: "780310"
  disableSteam: false
