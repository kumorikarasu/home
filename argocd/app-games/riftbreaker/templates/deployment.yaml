apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-config
data:
  config.cfg: |
    set server_name {{ .Values.server.name | quote }}
    set server_password "__SERVER_PASSWORD__"
    set server_rcon_password ""
    set server_max_players_count {{ .Values.server.maxPlayers | quote }}
    set server_broadcast_enabled {{ ternary "0" "1" .Values.server.disableSteam | quote }}
    set server_pause_game_when_empty "1"
    set app_mode "server"
    set disable_steam {{ ternary "1" "0" .Values.server.disableSteam | quote }}
    set campaign "open/open"
    set mission {{ .Values.server.mission | quote }}
    set difficulty {{ .Values.server.difficulty | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}-deployment
  labels:
    app: {{ .Values.name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      annotations:
        checksum/server-config: {{ .Values.server | toJson | sha256sum }}
        riftbreaker.home.ryougi.ca/redi-version: {{ .Values.mods.redi.version | quote }}
        riftbreaker.home.ryougi.ca/redi-activation: {{ .Values.mods.redi.activationRevision | quote }}
      labels:
        app: {{ .Values.name }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: appdata
        persistentVolumeClaim:
          claimName: {{ .Values.storage.existingClaim }}
      - name: config
        configMap:
          name: {{ .Values.name }}-config
      - name: rendered-config
        emptyDir: {}
      - name: wine-data
        persistentVolumeClaim:
          claimName: {{ .Values.name }}-wine
      - name: steam-home
        persistentVolumeClaim:
          claimName: {{ .Values.name }}-steam-home
      initContainers:
      - name: render-config
        image: busybox:1.36
        command: ["/bin/sh", "-ec"]
        args:
        - sed "s|__SERVER_PASSWORD__|${SERVER_PASSWORD}|g" /template/config.cfg > /config/config.cfg
        env:
        - name: SERVER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.name }}-secret
              key: password
        volumeMounts:
        - name: config
          mountPath: /template
          readOnly: true
        - name: rendered-config
          mountPath: /config
      containers:
      - name: {{ .Values.name }}
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: WINEESYNC
          value: "0"
        - name: WINEFSYNC
          value: "0"
        - name: STEAM_GAME_APPID
          value: {{ .Values.server.steamGameAppId | quote }}
        # steamclient64.dll is at the install root while the EXE runs from bin/.
        - name: WINEPATH
          value: 'Z:\opt\riftbreaker'
        ports:
        - name: game-tcp
          containerPort: {{ .Values.service.port }}
          protocol: TCP
        - name: game-udp
          containerPort: {{ .Values.service.port }}
          protocol: UDP
        - name: steam-udp
          containerPort: {{ .Values.service.steamPort }}
          protocol: UDP
        volumeMounts:
        - name: appdata
          mountPath: /opt/riftbreaker
          subPath: {{ .Values.storage.serverPath }}
        - name: wine-data
          mountPath: /data/.wine
        - name: steam-home
          mountPath: /home/steamuser
        - name: appdata
          mountPath: /data/saves
          subPath: {{ .Values.storage.savesPath }}
        - name: rendered-config
          mountPath: /data/config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}-service
spec:
  type: LoadBalancer
  loadBalancerIP: {{ .Values.service.loadBalancerIP }}
  externalTrafficPolicy: Local
  selector:
    app: {{ .Values.name }}
  ports:
  - name: game-tcp
    port: {{ .Values.service.port }}
    targetPort: game-tcp
    protocol: TCP
  - name: game-udp
    port: {{ .Values.service.port }}
    targetPort: game-udp
    protocol: UDP
  - name: steam-udp
    port: {{ .Values.service.steamPort }}
    targetPort: steam-udp
    protocol: UDP
