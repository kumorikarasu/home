apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}-deployment
  labels:
    app: {{ .Values.name }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      release: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.serviceLabel }}
        release: {{ .Values.name }}
        # Reuses the existing Service and its single external IP at cutover.
    spec:
      hostNetwork: true
      nodeSelector:
        dedicated: node4
      tolerations:
      - key: dedicated
        effect: NoSchedule
        operator: Equal
        value: node4
      volumes:
      - name: appdata
        persistentVolumeClaim:
          claimName: {{ .Values.storage.existingClaim }}
      containers:
      - name: {{ .Values.name }}
        image: {{ .Values.image.name }}:{{ .Values.image.tag }}
        resources:
          requests:
            memory: {{ .Values.resources.requests.memory | quote }}
            cpu: {{ .Values.resources.requests.cpu | quote }}
          limits:
            memory: {{ .Values.resources.limits.memory | quote }}
            cpu: {{ .Values.resources.limits.cpu | quote }}
        ports:
        - containerPort: {{ .Values.port }}
          hostPort: {{ .Values.port }}
          protocol: TCP
        {{- if .Values.startupProbe.enabled }}
        startupProbe:
          tcpSocket:
            port: {{ .Values.port }}
          periodSeconds: {{ .Values.startupProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.startupProbe.failureThreshold }}
        {{- end }}
        env:
        - name: UID
          value: {{ .Values.minecraft.uid | quote }}
        - name: GID
          value: {{ .Values.minecraft.gid | quote }}
        - name: UMASK
          value: {{ .Values.minecraft.umask | quote }}
        - name: EULA
          value: {{ .Values.minecraft.eula | quote }}
        - name: TYPE
          value: {{ .Values.minecraft.type | quote }}
        - name: VERSION
          value: {{ .Values.minecraft.version | quote }}
        - name: MEMORY
          value: {{ .Values.minecraft.memory | quote }}
        - name: DIFFICULTY
          value: {{ .Values.minecraft.difficulty | quote }}
        - name: OPS
          value: {{ .Values.minecraft.ops | quote }}
        - name: NEOFORGE_VERSION
          value: {{ .Values.minecraft.neoforgeVersion | quote }}
        - name: VIEW_DISTANCE
          value: {{ .Values.minecraft.viewDistance | quote }}
        - name: SIMULATION_DISTANCE
          value: {{ .Values.minecraft.simulationDistance | quote }}
        volumeMounts:
        - mountPath: /data
          subPath: {{ .Values.storage.subPath | quote }}
          name: appdata
