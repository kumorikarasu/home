---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}-deployment
  labels:
    app: {{ .Values.name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      hostNetwork: true
      nodeSelector:
        dedicated: node4
      volumes:
      - name: appdata
        persistentVolumeClaim:
          claimName: {{ .Values.storage.existingClaim }}
      tolerations:
      - key: "dedicated"
        effect: "NoSchedule"
        operator: "Equal"
        value: "node4"
      containers:
      - name: {{ .Values.name }}
        image: {{ .Values.image.name }}:{{ .Values.image.tag }}
        ports:
        - containerPort: {{ .Values.service.port }}
          hostPort: {{ .Values.service.port }}
          protocol: TCP
        {{- if .Values.startupProbe.enabled }}
        startupProbe:
          tcpSocket:
            port: {{ .Values.service.port }}
          periodSeconds: {{ .Values.startupProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.startupProbe.failureThreshold }}
        {{- end }}
        env:
        - name: UID
          value: {{ .Values.minecraft.uid | quote }}
        - name: GID
          value: {{ .Values.minecraft.gid | quote }}
        - name: UMASK
          value: {{ .Values.minecraft.umask | quote }}
        - name: EULA
          value: {{ .Values.minecraft.eula | quote }}
        - name: TYPE
          value: {{ .Values.minecraft.type | quote }}
        - name: VERSION
          value: {{ .Values.minecraft.version | quote }}
        - name: MEMORY
          value: {{ .Values.minecraft.memory | quote }}
        - name: DIFFICULTY
          value: {{ .Values.minecraft.difficulty | quote }}
        - name: OPS
          value: {{ .Values.minecraft.ops | quote }}
        {{- if .Values.minecraft.neoforgeVersion }}
        - name: NEOFORGE_VERSION
          value: {{ .Values.minecraft.neoforgeVersion | quote }}
        {{- end }}
        {{- if .Values.minecraft.motd }}
        - name: MOTD
          value: {{ .Values.minecraft.motd | quote }}
        {{- end }}
        {{- if .Values.minecraft.maxPlayers }}
        - name: MAX_PLAYERS
          value: {{ .Values.minecraft.maxPlayers | quote }}
        {{- end }}
        {{- if .Values.minecraft.viewDistance }}
        - name: VIEW_DISTANCE
          value: {{ .Values.minecraft.viewDistance | quote }}
        {{- end }}
        {{- if .Values.minecraft.simulationDistance }}
        - name: SIMULATION_DISTANCE
          value: {{ .Values.minecraft.simulationDistance | quote }}
        {{- end }}
        volumeMounts:
        - mountPath: /data
          subPath: {{ .Values.storage.subPath | quote }}
          name: appdata

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}-service
spec:
  type: {{ .Values.service.type }}
  loadBalancerIP: {{ .Values.service.loadBalancerIP }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  selector:
    app: {{ .Values.name }}
  ports:
    - name: game
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
